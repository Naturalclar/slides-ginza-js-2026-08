name: CI

on:
  push:
    branches: [main]
  # PR branches are covered by pull_request, so pushes to them are not built
  # twice.
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Covers the typecheck too: `build` runs `tsc` before `vite build`.
      - run: pnpm build
